<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sin conexión · Gainditu</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100dvh; display: flex; align-items: center; justify-content: center;
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #ffffff; color: #09090b; padding: 24px;
  }
  @media (prefers-color-scheme: dark) { body { background: #09090b; color: #fafafa; } }
  .card { max-width: 340px; text-align: center; }
  .badge {
    width: 64px; height: 64px; border-radius: 18px; background: #0B0C10; color: #fff;
    display: flex; align-items: center; justify-content: center; margin: 0 auto 20px;
    font-size: 34px; font-weight: 800; letter-spacing: -1px;
  }
  .badge span { color: #10B981; }
  h1 { font-size: 20px; margin: 0 0 8px; letter-spacing: -0.3px; }
  p { font-size: 14px; line-height: 1.6; color: #71717a; margin: 0 0 20px; }
  button {
    border: 0; background: #0B0C10; color: #fff; font-weight: 700; font-size: 14px;
    padding: 12px 24px; border-radius: 999px; cursor: pointer;
  }
  @media (prefers-color-scheme: dark) { button { background: #fff; color: #09090b; } }
</style>
</head>
<body>
  <div class="card">
    <div class="badge">g<span>.</span></div>
    <h1>Sin conexión</h1>
    <p>No hay internet ahora mismo. Comprueba tu conexión y vuelve a intentarlo; tu progreso está a salvo.</p>
    <button onclick="location.reload()">Reintentar</button>
  </div>
</body>
</html>
